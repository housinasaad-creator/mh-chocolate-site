<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b0e0a">
<title>MH Chocolate — Kalpten gelen çikolata</title>
<meta name="description" content="Evde, elle ve sadece sipariş üzerine hazırlanan çikolata. Parçayı ortadan kes, katmanlarını gör, tasarla ve siparişini WhatsApp’tan gönder.">
<meta property="og:type" content="website">
<meta property="og:title" content="MH Chocolate — Kalpten gelen çikolata">
<meta property="og:description" content="Parçayı kes, katmanlarını gör, kendi çikolatanı tasarla. Siparişin tek dokunuşla WhatsApp’ta.">
<link rel="icon" href="assets/logo.jpg">
<meta property="og:image" content="assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/v2.css">
<link rel="stylesheet" href="css/v3.css">
</head>
<body class="is-loading">

<div class="pre" id="pre" aria-hidden="true">
  <div class="pre-in"><img class="pre-logo" src="assets/logo.jpg" alt=""><i class="pre-ring"></i></div>
</div>

<header class="hdr" id="hdr">
  <a class="logo" href="#top" aria-label="MH Chocolate">
    <img class="logo-img" src="assets/logo.jpg" alt="MH Chocolate" width="44" height="44">
    <span>MH CHOCOLATE</span>
  </a>
  <div class="hdr-r">
    <button class="snd" id="snd" type="button" aria-label="Sesi aç" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.6L12.5 19V5L7.6 9.5H4z" fill="currentColor"/><path class="sw" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.4a7.8 7.8 0 0 1 0 11.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path class="sx" d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <button class="bag" id="bag" type="button" aria-label="Sepetim">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 12H6.2L5 8z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <b id="bagN">0</b>
    </button>
  </div>
</header>

<main id="top">
  <!-- ======== الهيرو: بحيرة شوكولا سائلة تُخلط + قطع غاطسة فيها ======== -->
  <section class="hero" id="hero">
    <div class="hero-stick">
      <canvas class="liq" id="liq"></canvas>
      <div class="hero-shade" aria-hidden="true"></div>
      <canvas class="hero-piece" id="heroPiece" aria-label="Çikolata"></canvas>
      <div class="hero-copy" id="heroCopy"></div>
      <ol class="ch-dots" id="chDots" aria-label="Bölümler"></ol>
      <p class="stir" id="hHint"><i></i><span></span></p>
    </div>
  </section>

  <!-- ======== جمل لعشّاق الشوكولا ======== -->
  <section class="quotes drip-top" id="sozler">
    <div class="wrap narrow">
      <p class="kicker" id="qKicker"></p>
      <div class="q-stage" id="qStage"></div>
      <div class="q-dots" id="qDots"></div>
    </div>
  </section>

  <!-- ======== ورشة القطعة: كاملة + مقطوعة، أربع خطوات، طبقات، مؤشرات ======== -->
  <section class="studio drip-top" id="atolye">
    <div class="wrap">
      <header class="sec-head reveal">
        <p class="kicker" id="sKicker"></p>
        <h2 class="h2" id="sH2"></h2>
        <p class="lead" id="sLead"></p>
      </header>
      <nav class="shapes reveal" id="shapes" aria-label="Şekil"></nav>
      <div class="studio-grid">
        <div class="stage">
          <canvas id="studioPiece" aria-label="3D çikolata ve kesiti"></canvas>
          <div class="callouts" id="callouts" aria-hidden="true"></div>
          <button class="nav-btn prev" id="shPrev" type="button" aria-label="Önceki"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button class="nav-btn next" id="shNext" type="button" aria-label="Sonraki"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <p class="tag tag-l" id="labWhole"></p><p class="tag tag-r" id="labCut"></p>
          <p class="stage-cap"><b id="shName"></b><span id="shDesc"></span></p>
          <p class="drag-hint" id="dragHint"></p>
          <button class="replay" id="replay" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="replayT"></span></button>
        </div>
        <div class="panel">
          <ol class="wiz" id="wiz"></ol>
          <div class="info reveal">
            <h3 class="sub-h" id="layH"></h3>
            <div class="layers" id="layers"></div>
            <p class="addons" id="addons"></p>
            <h3 class="sub-h" id="metH"></h3>
            <div class="meters" id="meters"></div>
            <p class="small" id="metN"></p>
          </div>
          <div class="buy">
            <div class="og row"><h3 id="lQty"></h3><div class="qty"><button type="button" id="qMinus" aria-label="-">−</button><b id="qVal">1</b><button type="button" id="qPlus" aria-label="+">+</button></div></div>
            <textarea class="field" id="sNote" rows="2" maxlength="240"></textarea>
            <button class="btn block" id="sAdd" type="button"></button>
            <p class="price-note" id="sPrice"></p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ======== زمن وحرارة: ساعة تعمل وحدها + مقياس حرارة + قطعة تلين ======== -->
  <section class="time drip-top" id="zaman">
    <div class="wrap">
      <header class="sec-head reveal"><p class="kicker" id="tKicker"></p><h2 class="h2" id="tH2"></h2><p class="lead" id="tLead"></p></header>
      <div class="time-grid">
        <div class="melt reveal"><canvas id="meltCanvas" aria-label="Eriyen çikolata"></canvas><p class="melt-state"><b id="mState"></b><span id="mDesc"></span></p></div>
        <div class="gauges reveal">
          <div class="og"><h3 id="tTypeL"></h3><div class="chips" id="tTypes"></div></div>
          <div class="clock-wrap"><svg id="clock" viewBox="0 0 200 200" aria-hidden="true"></svg><div class="clock-c"><b id="cHour">0</b><span id="cUnit"></span></div></div>
          <div class="temp-row">
            <svg class="therm" id="therm" viewBox="0 0 70 230" aria-hidden="true"></svg>
            <div class="temp-ctl"><h3 id="tTempL"></h3><div class="temp-val"><b id="tVal">22</b><i>°C</i></div><input type="range" id="tRange" min="10" max="36" step="1" value="22" aria-label="Sıcaklık"><p class="zone" id="tZone"></p></div>
          </div>
          <p class="stable" id="tStable"></p>
          <ul class="phases" id="phases"></ul>
          <p class="small" id="tNote"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- ======== كيف تتحضّر: منحنى التمبرة ======== -->
  <section class="craft drip-top" id="hazirlik">
    <div class="wrap">
      <header class="sec-head center reveal"><p class="kicker" id="kKicker"></p><h2 class="h2" id="kH2"></h2><p class="lead" id="kLead"></p></header>
      <div class="og center reveal"><h3 id="kTypeL"></h3><div class="chips" id="kTypes"></div></div>
      <div class="curve-wrap reveal"><svg id="curve" viewBox="0 0 820 340" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg><div class="curve-read"><b id="kDeg">22</b><i>°C</i></div></div>
      <ol class="csteps" id="csteps"></ol>
      <p class="how-note" id="kNote"></p>
    </div>
  </section>

  <!-- ======== طلب خاص ======== -->
  <section class="custom drip-top" id="ozel">
    <div class="wrap narrow">
      <header class="sec-head reveal"><p class="kicker" id="cKicker"></p><h2 class="h2" id="cH2"></h2><p class="lead" id="cLead"></p></header>
      <div class="chips reveal" id="cuChips"></div>
      <textarea class="field big reveal" id="cuText" rows="4" maxlength="600"></textarea>
      <button class="btn reveal" id="cuAdd" type="button"></button>
    </div>
  </section>

  <section class="gallery" id="galeri" hidden>
    <div class="wrap">
      <header class="sec-head reveal"><p class="kicker" id="gKicker"></p><h2 class="h2" id="gH2"></h2></header>
      <div class="gal" id="gal"></div>
      <a class="btn ghost" id="gMore" href="#" target="_blank" rel="noopener"></a>
    </div>
  </section>

  <!-- ======== كيف تطلب ======== -->
  <section class="how drip-top" id="nasil">
    <div class="wrap">
      <header class="sec-head reveal"><p class="kicker" id="wKicker"></p><h2 class="h2" id="wH2"></h2></header>
      <ol class="steps" id="steps"></ol>
      <p class="how-note reveal" id="wNote"></p>
    </div>
  </section>
</main>

<footer class="ftr drip-top">
  <div class="wrap">
    <div class="ftr-top">
      <div class="ftr-brand"><img class="ftr-logo-img" src="assets/logo.jpg" alt="MH Chocolate" width="88" height="88"><p id="fLine"></p></div>
      <ul class="ftr-contact">
        <li><a id="fWa" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 8.5c.3 2.6 2.9 5.2 6 6.3l1.3-1.3-1.9-1-.9.7c-.9-.4-1.9-1.4-2.3-2.3l.7-.9-1-1.9L9 8.5z" fill="currentColor"/></svg><span id="fWaT"></span></a></li>
        <li><a id="fIg" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor"/></svg><span id="fIgT"></span></a></li>
        <li><a id="fTel" href="#"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 3.5h3l1.3 4-2 1.3a11 11 0 0 0 5.3 5.3l1.3-2 4 1.3v3a2.2 2.2 0 0 1-2.4 2.2A15.6 15.6 0 0 1 4.4 5.9 2.2 2.2 0 0 1 6.6 3.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span id="fTelT"></span></a></li>
        <li><span class="addr"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.2 7-11.2A7 7 0 0 0 5 9.8C5 14.8 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="9.8" r="2.4" fill="currentColor"/></svg><span id="fAddr"></span></span></li>
      </ul>
    </div>
    <div class="ftr-bot"><span id="fRights"></span><span id="fCredit"></span></div>
  </div>
</footer>

<div class="bar" id="bar"><button type="button" id="barOpen"><span id="barTxt"></span></button><button class="btn" type="button" id="barSend"></button></div>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" aria-hidden="true" role="dialog" aria-label="Sepetim">
  <header class="sheet-h"><h3 id="shTitle"></h3><button class="x" id="shClose" type="button" aria-label="Kapat">×</button></header>
  <div class="sheet-body" id="shBody"></div>
  <footer class="sheet-f" id="shFoot"></footer>
</aside>

<div class="done" id="done" aria-hidden="true">
  <div class="done-in"><div class="done-heart">♥</div><h3 id="dT"></h3><p id="dD"></p><button class="btn block" id="dOk" type="button"></button><button class="link" id="dAgain" type="button"></button></div>
</div>
<div class="toast" id="toast" role="status"></div>

<div class="cur" id="cur" aria-hidden="true"><i class="cur-ic"></i></div><div class="cur-t" id="curT1" aria-hidden="true"></div><div class="cur-t t2" id="curT2" aria-hidden="true"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
